[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# Cyrillic strings are the domain language, not ambiguous-unicode accidents.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/api/*" = ["B008"]          # FastAPI Depends() in defaults is the framework idiom
"tools/dataset_generator/generator.py" = ["E501"]  # vendored: long Cyrillic templates
